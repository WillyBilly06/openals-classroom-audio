name: als_app
description: "OpenALS assistive-listening mobile prototype."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  flutter_volume_controller: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  image_path_android: "assets/icon/app_icon_android_legacy_circle.png"

  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21

  adaptive_icon_background: "#154734"
  adaptive_icon_foreground: "assets/icon/app_icon_android_foreground.png"
  adaptive_icon_foreground_inset: 16

  web:
    generate: true
    image_path: "assets/icon/app_icon.png"

  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/icon/
